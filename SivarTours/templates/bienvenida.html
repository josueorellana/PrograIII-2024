<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Sivar Tours</title>
    <style> 
    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-image: url('{{ url_for("static", filename="images/fondobienvenida.jpg") }}');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: rgb(3, 28, 51);
        text-align: center;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: transparent;
    }

    header img.header-logo {
        height: 50px;
        max-width: 150px;
        margin-right: auto;
    }

    header a {
        text-decoration: none;
        color: rgb(10, 0, 0);
        font-size: 16px;
        background-color: rgb(155, 237, 30);
        padding: 10px 20px;
        border-radius: 5px;
        transition: background-color 0.3s;
    }

    header a:hover {
        background-color: rgb(81, 243, 132);
    }

    .welcome-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .content-box {
        background-color: rgba(255, 255, 255, 0.8);
        width: 80%;
        max-width: 600px;
        padding: 20px;
        border-radius: 15px;
        box-shadow: none;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 2.4em;
        margin: 0.5em 0;
    }

    p {
        font-size: 1em;
        max-width: 600px;
        margin: 0 auto 1.5em;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .btn {
        font-size: 1.1em;
        color: white;
        background-color: rgb(33, 5, 70);
        padding: 10px 22px;
        text-decoration: none;
        border-radius: 8px;
        transition: background-color 0.3s;
    }

    .btn:hover {
        background-color: blue;
    }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/logosivar.jpg') }}" alt="Logo Sivar Tours" class="header-logo">
        <a href="/login">Iniciar Sesión</a>
    </header>

    <div class="welcome-container">
        <div class="content-box">
            <h1>¡Bienvenido a Sivar Tours!</h1>
            <p>Descubre los destinos turísticos más visitados de El Salvador</p>

        <div class="btn-container">
            <a href="/login" class="btn">Comenzar</a>
        </div>
    </div>
    </div>
</body>
</html>
