<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Rutas Turísticas</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #150a43;
            background-image: url("{{ url_for('static', filename='images/chatbot/fondochat1.jpg') }}");
            display: flex;
            justify-content: center;
            text-align: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background-color: #ffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background-color: #075E54;
            color: #ffff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 80%;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: #d1d8e0;
        }

        .bot-message {
            align-self: flex-start;
            background-color: antiquewhite;
        }

        .input-area {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: aliceblue;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            margin-right: 10px;
        }

        .input-area button {
            background-color: #075E54;
            color: #ddd;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #075E54;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">Asistente Virtuial - SIvar Tours</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="input-area">
            <input id="userInput" type="text" placeholder="Hola soy el asistente virtual de Sivar Tours, Como puedo ayudarte?">
            <button id="sendButton"></button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");

        // Rederizar mensajes 
        function renderMessage(message, type) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${type}-message`;
            messageDiv.textContent = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enviar mensajes del usuario
        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (userMessage === "") return;

            renderMessage(userMessage, "user");
            userInput.value = "";

            try {
                const response = await fetch(`/respuesta?query=${encodeURIComponent(userMessage)}`);
                const botMessage = await response.text();
                renderMessage(botMessage, "bot");
            } catch (error) {
                renderMessage("Lo siento, hubo un error al procesar tu solicitud.", "bot");
            }
        }

        // Enviar consulta al servidor
        sendButton.addEventListener("click", sendMessage);
            
        // ENviar mensaje al presionar enter
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendButton.click();
        });
    </script>
</body>
</html>
