<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(6, 34, 58);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        /*Encabezado logo*/
        header {
            display: flex;
            align-items: left;
            justify-content: left;
            padding: 10px 20px;
            background-color: transparent;
        }

        header img.header-logo {
            height: 50px;
            max-width: 150px;
            margin-right: 30px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #4CAF50;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
        }
        .btn:hover {
            background: #4CAF50;
        }
        .link {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/registro/logosivar.jpg') }}" class="header-logo">

    </header>
    <div class="container">
        <h2>Registrar Nuevo Usuario</h2>
        <form method="POST" action="{{ url_for('registro') }}">
            <input type="email" name="correo" placeholder="Correo electronico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn">Registrar</button>
            
        </form>
        <a href="{{ url_for('login') }}" class="link">Volver al Inicio de Sesion</a>
    </div>
    {% if message %}
    <p class="message">{{ message }}</p>
{% endif %}

</body>
</html>
