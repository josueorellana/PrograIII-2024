<!-- frontend/usuarios.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Usuarios</title>
  <style>
    /* Estilos básicos para mejorar la apariencia */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    form, .search-bar {
      background-color: #fff;
      padding: 20px 40px;
      margin-bottom: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }
    button {
      padding: 10px;
      background-color: #4CAF50;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 3px;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    .editar {
      background-color: #2196F3;
      color: white;
      padding: 5px 10px;
      margin: 2px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .eliminar {
      background-color: #f44336;
      color: white;
      padding: 5px 10px;
      margin: 2px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .editar:hover {
      background-color: #0b7dda;
    }
    .eliminar:hover {
      background-color: #da190b;
    }
  </style>
</head>
<body>
  <form id="form-usuario">
    <h2>Registro de Usuarios</h2>
    <label for="usuario">Usuario:</label>
    <input type="text" id="usuario" name="usuario" required>

    <label for="clave">Clave:</label>
    <input type="password" id="clave" name="clave" required>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">

    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion">

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono">

    <button type="submit">Registrar</button>
  </form>

  <div class="search-bar">
    <h2>Buscar Usuarios</h2>
    <input type="text" id="buscar" placeholder="Buscar por nombre o usuario">
    <button onclick="buscarUsuarios()">Buscar</button>
  </div>

  <h2>Lista de Usuarios</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-usuarios">
      <!-- Filas de usuarios se insertarán aquí -->
    </tbody>
  </table>

  <script src="js/usuarios.js"></script>
</body>
</html>
